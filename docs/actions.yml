# actions.yml
# ─────────────────────────────────────────────────────────────────────────────
# Definitions of all action keys you can use in a recipe’s steps.actions section.

actions:
  - key: changeType
    class: ChangeTypeAction
    description: >
      Change the declared type of a variable, parameter, method return,
      object creation, or field to a new type.
    parameters:
      - name: newType
        type: String
        description: Fully‐qualified or simple name of the target type.
    appliesTo:
      - VariableDeclarationExpr
      - Parameter
      - MethodDeclaration
      - ObjectCreationExpr
      - FieldDeclaration
    example: |
      Before:
      
      // Change JAX‑RS Response → Spring’s ResponseEntity
      public Response getFoo() { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "methodName": "getFoo",
          "returnTypePattern": "\\bResponse\\b"
        },
        "actions": [
          { "changeType": { "newType": "ResponseEntity" } }
        ]
      }
      
      After:
      
      public ResponseEntity getFoo() { … }
      

  - key: replaceWithMethodCall
    class: ReplaceWithMethodCallAction
    description: >
      Replace an object‐creation (`new X(...)`) or a method call (`x.old(...)`)
      with a call to `scope.method(...)`. You can carry over arguments or
      unwrap a nested scope call into the new call.
    parameters:
      - name: scope
        type: String
        description: Class or variable name on which to call the new method.
      - name: method
        type: String
        default: now
        description: Name of the method to invoke.
      - name: includeScopeArg
        type: Boolean
        default: false
        description: Pass the original call’s scope as the first argument.
      - name: unwrapScopeArg
        type: Boolean
        default: false
        description: If true, assume the old call’s scope is itself a
          single‐arg call and use its argument directly.
    appliesTo:
      - ObjectCreationExpr
      - MethodCallExpr
    example: |
      Before (UseRequireNonNullElse):
      
      Optional.ofNullable(name).orElse("world");
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodCallExpr",
          "scopePattern": "Optional\\.ofNullable",
          "methodName": "orElse"
        },
        "actions": [
          {
            "replaceWithMethodCall": {
              "scope": "Objects",
              "method": "requireNonNullElse",
              "unwrapScopeArg": "true"
            }
          },
          { "addImport": { "name": "java.util.Objects" } }
        ]
      }
      
      After:
      
      Objects.requireNonNullElse(name, "world");
      

  - key: wrapArgument
    class: WrapArgumentAction
    description: >
      Wrap a method call’s first argument inside another expression
      template. The template must include `#{}` where the original
      expression should go.
    parameters:
      - name: template
        type: String
        description: Java code snippet with `#{}` placeholder.
    appliesTo:
      - MethodCallExpr
    example: |
      Before:
      
      Optional.ofNullable(name).orElse("world");
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodCallExpr",
          "scopePattern": "Optional\\.ofNullable",
          "methodName": "orElse"
        },
        "actions": [
          {
            "wrapArgument": {
              "template": "Objects.requireNonNullElse(#{}, \"fallback\")"
            }
          },
          { "addImport": { "name": "java.util.Objects" } }
        ]
      }
      
      After:
      
      Objects.requireNonNullElse(name, "fallback");
      

  - key: switchToReturnExpression
    class: SwitchToReturnExpressionAction
    description: >
      Convert a `switch(stmt) { case …: r = …; break; … }`
      followed by `return r;` into a `return switch(expr) { case … -> …; … }`.
    parameters: []
    appliesTo:
      - SwitchStmt
    example: |
      Before:
      
      int result;
      switch(code) {
        case 1:
          result = foo();
          break;
        default:
          result = bar();
      }
      return result;
      
      Recipe:
      
      {
        "match": { "nodeType": "SwitchStmt" },
        "actions": [
          { "switchToReturnExpression": {} }
        ]
      }
      
      After:
      
      return switch(code) {
        case 1 -> foo();
        default -> bar();
      };
      

  - key: collapseLiteralConcat
    class: CollapseLiteralConcatAction
    description: >
      Flatten a tree of string concatenations containing `"\n"`
      into a single `TextBlockLiteralExpr` (Java 15+ text block).
    parameters: []
    appliesTo:
      - BinaryExpr
    example: |
      Before:
      
      String html = "<ul>\n"
                  + "  <li>foo</li>\n"
                  + "  <li>bar</li>\n"
                  + "</ul>";
      
      Recipe:
      
      {
        "match": {
          "nodeType": "BinaryExpr",
          "literalOnly": true,
          "literalPattern": "\\\\n"
        },
        "actions": [
          { "collapseLiteralConcat": {} }
        ]
      }
      
      After:
      
      String html = """
          <ul>
            <li>foo</li>
            <li>bar</li>
          </ul>
          """;
      

  - key: forToForEach
    class: ForToForEachAction
    description: >
      Rewrite a classic `for (int i = 0; i < arr.length; i++) {…}`
      or `for (int i = 0; i < list.size(); i++) {…}` into an enhanced
      `for (Element e : arrOrList) {…}` loop.
    parameters: []
    appliesTo:
      - ForStmt
    example: |
      Before:
      
      for (int i = 0; i < items.size(); i++) {
        System.out.println(items.get(i));
      }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ForStmt",
          "initVarPattern": "i",
          "conditionPattern": "i < .+\\.size\\(\\)",
          "updatePattern": "(?:\\+\\+i|i\\+\\+)"
        },
        "actions": [
          { "forToForEach": {} }
        ]
      }
      
      After:
      
      for (var item : items) {
        System.out.println(item);
      }
      

  - key: insertBefore
    class: InsertBeforeAction
    description: >
      Insert a statement immediately before the matched node, within the same block.
    parameters:
      - name: code
        type: String
        description: A single Java statement (must end with `;`).
    appliesTo:
      - any Statement
    example: |
      Before:
      
      public String greeting(String name) {
        ...
      }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "namePattern": "greeting",
          "paramCount": 1,
          "returnTypePattern": "String",
          "requiresImport": "java.util.Objects"
        },
        "actions": [
          {
            "insertBefore": {
              "code": "System.out.println(\"[LOG] Entering greeting\");"
            }
          },
          {
            "insertAfter": {
              "code": "System.out.println(\"[LOG] Exiting greeting\");"
            }
          }
        ]
      }
      
      After:
      
      public String greeting(String name) {
          System.out.println("[LOG] Entering greeting");
          ...
          System.out.println("[LOG] Exiting greeting");
      }
      

  - key: insertAfter
    class: InsertAfterAction
    description: >
      Insert a statement immediately after the matched node, within the same block.
    parameters:
      - name: code
        type: String
        description: A single Java statement (must end with `;`).
    appliesTo:
      - any Statement
    example: |
      (See `insertBefore` above—combined example.)

  - key: removeNode
    class: RemoveNodeAction
    description: >
      Delete the matched AST node entirely (including its subtree).
    parameters: []
    appliesTo:
      - any Node
    example: |
      Before (RemoveDebugPrints):
      
      System.out.println("debug!");
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ExpressionStmt",
          "matchExpr": "System\\.out\\.println\\(\"debug!\"\\)"
        },
        "actions": [
          { "removeNode": {} }
        ]
      }
      
      After:
      
      // the debug print is gone
      

  - key: replaceWithTemplate
    class: ReplaceWithTemplateAction
    description: >
      Replace the matched node by parsing a given Java snippet or template
      into the AST. Template must form a valid expression or statement.
    parameters:
      - name: template
        type: String
        description: Valid Java code fragment to substitute.
    appliesTo:
      - any Expression or Statement
    example: |
      Before (UseIntegerSumFor1Plus2):
      
      int sum = 1 + 2;
      
      Recipe:
      
      {
        "match": {
          "nodeType": "BinaryExpr",
          "literalPattern": "1\\s*\\+\\s*2"
        },
        "actions": [
          { "replaceWithTemplate": { "template": "Integer.sum(1, 2)" } }
        ]
      }
      
      After:
      
      int sum = Integer.sum(1, 2);
      

  - key: addImport
    class: AddImportAction
    description: >
      Add a single‐type import to the top of the compilation unit if not already present.
    parameters:
      - name: name
        type: String
        description: Fully qualified type to import.
    appliesTo:
      - any Node (operates at CU level)
    example: |
      In `UseRequireNonNullElse` above we added:
      
      { "addImport": { "name": "java.util.Objects" } }
      
      which yields at top of file:
      
      import java.util.Objects;
      

  - key: removeImport
    class: RemoveImportAction
    description: >
      Remove a single‐type import from the compilation unit if present.
    parameters:
      - name: name
        type: String
        description: Fully qualified type to remove.
    appliesTo:
      - any Node (operates at CU level)
    example: |
      Before:
      
      import java.lang.Deprecated;
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "annotation": "Deprecated"
        },
        "actions": [
          { "removeImport": { "name": "java.lang.Deprecated" } }
        ]
      }
      
      After:
      
      // import gone if no other use
      

  - key: addAnnotation
    class: AddAnnotationAction
    description: >
      Add an annotation (by simple name) to a node supporting annotations.
      You may include inline attributes, e.g. `RequestMapping("/path")`.
    parameters:
      - name: name
        type: String
        description: Simple annotation name (no leading `@`).  
      - name: attributes
        type: Map[String,String]
        description: Optional map of attribute names→values.
    appliesTo:
      - ClassOrInterfaceDeclaration
      - MethodDeclaration
      - FieldDeclaration
      - Parameter
    example: |
      Before (DeprecateUtils):
      
      public class FooUtil { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "hasModifier": "public",
          "namePattern": ".*Util$",
          "forbidsImport": "java.lang.Deprecated"
        },
        "actions": [
          { "addImport": { "name": "java.lang.Deprecated" } },
          { "addAnnotation": { "name": "Deprecated" } }
        ]
      }
      
      After:
      
      import java.lang.Deprecated;
      @Deprecated
      public class FooUtil { … }
      

  - key: removeAnnotation
    class: RemoveAnnotationAction
    description: >
      Remove a named annotation (by simple name) from a node supporting annotations.
    parameters:
      - name: name
        type: String
        description: Simple annotation name to remove.
    appliesTo:
      - any NodeWithAnnotations
    example: |
      Before:
      
      @Path("/x")
      @Produces("application/xml")
      public class Config { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "annotation": "Path"
        },
        "actions": [
          { "removeAnnotation": { "name": "Path" } },
          { "removeAnnotation": { "name": "Produces" } }
        ]
      }
      
      After:
      
      public class Config { … }
      

  - key: updateAnnotationAttribute
    class: UpdateAnnotationAttributeAction
    description: >
      Modify the value of a named attribute in a normal annotation.
      Leaves other attributes untouched.
    parameters:
      - name: annotation
        type: String
        description: The annotation’s simple name.
      - name: attribute
        type: String
        description: Name of the attribute to update.
      - name: newValue
        type: String
        description: New literal value (without quotes).
    appliesTo:
      - any NodeWithAnnotations
    example: |
      Before:
      
      @RequestMapping("/old")
      public class X { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "annotation": "RequestMapping"
        },
        "actions": [
          {
            "updateAnnotationAttribute": {
              "annotation": "RequestMapping",
              "attribute": "value",
              "newValue": "/new"
            }
          }
        ]
      }
      
      After:
      
      @RequestMapping("/new")
      public class X { … }
      

  - key: removeComment
    class: RemoveCommentAction
    description: >
      Strip any comment (line or block) attached to the matched node.
    parameters: []
    appliesTo:
      - any Node
    example: |
      Before:
      
      // TODO: fix this
      int x = compute();
      
      Recipe:
      
      {
        "match": { "matchExpr": "// TODO:" },
        "actions": [
          { "removeComment": {} }
        ]
      }
      
      After:
      
      int x = compute();
      

  - key: removeExceptionFromCatch
    class: RemoveExceptionFromCatchAction
    description: >
      In a multi‑catch clause, remove one exception type. If it was the only
      type, collapse the catch or replace with `catch(Exception e)`.
    parameters:
      - name: exception
        type: String
        description: Simple name of the exception to remove.
    appliesTo:
      - CatchClause
    example: |
      Before:
      
      } catch (EjbAccessException | ArrayIndexOutOfBoundsException e) {
        throw new RuntimeException(e);
      }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "CatchClause",
          "matchExpr": "\\| EjbAccessException"
        },
        "actions": [
          { "removeExceptionFromCatch": { "exception": "EjbAccessException" } }
        ]
      }
      
      After:
      
      } catch (ArrayIndexOutOfBoundsException e) {
        throw new RuntimeException(e);
      }
      

  - key: renameMethodCall
    class: RenameMethodCallAction
    description: >
      Change the name of a method invocation (callsite only).
    parameters:
      - name: oldName
        type: String
      - name: newName
        type: String
    appliesTo:
      - MethodCallExpr
    example: |
      Before:
      
      svc.getUserName();
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodCallExpr",
          "methodName": "getUserName"
        },
        "actions": [
          { "renameMethodCall": { "oldName": "getUserName", "newName": "getUser" } }
        ]
      }
      
      After:
      
      svc.getUser();
      

  - key: removeModifier
    class: RemoveModifierAction
    description: >
      Drop a modifier keyword (e.g. `final`, `public`, `static`) from a node.
    parameters:
      - name: modifier
        type: String
        description: Keyword to remove (case‑insensitive).
    appliesTo:
      - any NodeWithModifiers
    example: |
      Before:
      
      private final int count;
      
      Recipe:
      
      {
        "match": {
          "nodeType": "FieldDeclaration",
          "hasModifier": "final"
        },
        "actions": [
          { "removeModifier": { "modifier": "final" } }
        ]
      }
      
      After:
      
      private int count;
      

  - key: addModifier
    class: AddModifierAction
    description: >
      Add a modifier keyword (`public`, `protected`, `private`, `static`, etc.).
    parameters:
      - name: modifier
        type: String
    appliesTo:
      - any NodeWithModifiers
    example: |
      Before:
      
      int helper() { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "namePattern": "helper"
        },
        "actions": [
          { "addModifier": { "modifier": "private" } }
        ]
      }
      
      After:
      
      private int helper() { … }
      

  - key: setAccessLevel
    class: SetAccessLevelAction
    description: >
      Set exactly one access modifier (`public`/`protected`/`private`) on a
      method, field, or class—removing others.
    parameters:
      - name: level
        type: String
        description: One of `public`, `protected`, or `private`.
    appliesTo:
      - MethodDeclaration
      - FieldDeclaration
      - ClassOrInterfaceDeclaration
    example: |
      Before:
      
      public static class A { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "namePattern": "A"
        },
        "actions": [
          { "setAccessLevel": { "level": "protected" } }
        ]
      }
      
      After:
      
      protected class A { … }
      

  - key: renameVariable
    class: RenameVariableAction
    description: >
      Rename a local variable (declaration + all NameExpr references) within
      the same compilation unit.
    parameters:
      - name: newName
        type: String
    appliesTo:
      - VariableDeclarator
    example: |
      Before:
      
      int count = list.size();
      System.out.println(count);
      
      Recipe:
      
      {
        "match": {
          "nodeType": "VariableDeclarator",
          "namePattern": "count"
        },
        "actions": [
          { "renameVariable": { "newName": "size" } }
        ]
      }
      
      After:
      
      int size = list.size();
      System.out.println(size);
      

  - key: renameClass
    class: RenameClassAction
    description: >
      Rename a class or interface (declaration only); references must be
      updated separately via a rename‐refactoring tool.
    parameters:
      - name: newName
        type: String
    appliesTo:
      - ClassOrInterfaceDeclaration
    example: |
      Before:
      
      class FooUtil { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "namePattern": "FooUtil"
        },
        "actions": [
          { "renameClass": { "newName": "FooHelper" } }
        ]
      }
      
      After:
      
      class FooHelper { … }
      

  - key: clearInitializer
    class: ClearInitializerAction
    description: >
      Remove the initializer of a variable declaration but keep the declaration.
    parameters: []
    appliesTo:
      - VariableDeclarator
    example: |
      Before:
      
      int x = 5;
      
      Recipe:
      
      {
        "match": {
          "nodeType": "VariableDeclarator",
          "matchExpr": "= 5"
        },
        "actions": [
          { "clearInitializer": {} }
        ]
      }
      
      After:
      
      int x;
      

  - key: removeStatements
    class: RemoveStatementsAction
    description: >
      Remove all statements in a block (e.g. method or static initializer),
      leaving an empty block.
    parameters: []
    appliesTo:
      - BlockStmt
    example: |
      Before:
      
      void foo() {
          doA();
          doB();
      }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "BlockStmt",
          "parentNodeType": "MethodDeclaration",
          "namePattern": "foo"
        },
        "actions": [
          { "removeStatements": {} }
        ]
      }
      
      After:
      
      void foo() {
      }
      

  - key: wrapWithTryCatch
    class: WrapWithTryCatchAction
    description: >
      Surround a statement or block with a `try { … } catch(Exception e) { … }`.
      The catch body may be provided via a template.
    parameters:
      - name: exception
        type: String
        default: Exception
        description: Exception type to catch.
      - name: bodyTemplate
        type: String
        optional: true
        description: Java code for catch body; `#{e}` may stand in for the exception.
    appliesTo:
      - Statement
      - BlockStmt
    example: |
      Before:
      
      processData();
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ExpressionStmt",
          "matchExpr": "processData\\("
        },
        "actions": [
          {
            "wrapWithTryCatch": {
              "exception": "IOException",
              "bodyTemplate": "logger.error(#{e});"
            }
          }
        ]
      }
      
      After:
      
      try {
        processData();
      } catch (IOException e) {
        logger.error(e);
      }
      

  - key: migrateAnnotation
    class: MigrateAnnotationAction
    description: >
      Convert one annotation to another, possibly remapping attributes by name.
    parameters:
      - name: from
        type: String
        description: Source annotation simple name.
      - name: to
        type: String
        description: Target annotation simple name.
      - name: attrMap
        type: Map[String,String]
        description: Optional map of old→new attribute names.
    appliesTo:
      - any NodeWithAnnotations
    example: |
      Before:
      
      @GET
      public String foo() {…}
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "annotation": "GET"
        },
        "actions": [
          {
            "migrateAnnotation": {
              "from": "GET",
              "to": "GetMapping",
              "attrMap": { "value": "path" }
            }
          }
        ]
      }
      
      After:
      
      @GetMapping(path = "/…")
      public String foo() {…}
      

  - key: replaceWithScope
    class: ReplaceWithScopeAction
    description: >
      In a chained method call `X.s1().s2().s3()`, drop the innermost
      call and promote its scope, e.g. remove `.s2()` or `.s3()`.
    parameters: []
    appliesTo:
      - MethodCallExpr
    example: |
      Before (Link chain):
      
      Link.fromUri(uri).rel("self").build();
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodCallExpr",
          "scopePattern": "Link\\.fromUri",
          "methodName": "rel"
        },
        "actions": [
          { "replaceWithScope": {} }
        ]
      }
      
      After:
      
      Link.fromUri(uri).build();
      

  - key: updateImplements
    class: UpdateImplementsAction
    description: >
      Add or remove interfaces in a class’s `implements` clause.
      Removes any implemented type matching `remove` and then adds `add`
      if not already present.
    parameters:
      - name: remove
        type: String
        description: Simple or fully‑qualified name of the interface to remove.
      - name: add
        type: String
        description: Fully‑qualified name of the interface to add.
    appliesTo:
      - ClassOrInterfaceDeclaration
    example: |
      Before:
      
      public class CustomHealthCheck implements HealthIndication { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "ClassOrInterfaceDeclaration",
          "namePattern": "CustomHealthCheck"
        },
        "actions": [
          {
            "updateImplements": {
              "remove": "HealthIndication",
              "add": "org.springframework.boot.actuate.health.HealthIndicator"
            }
          },
          { "addImport": { "name": "org.springframework.boot.actuate.health.HealthIndicator" } }
        ]
      }
      
      After:
      
      import org.springframework.boot.actuate.health.HealthIndicator;
      public class CustomHealthCheck implements HealthIndicator { … }
      

  - key: changeMethodReturnType
    class: ChangeMethodReturnTypeAction
    description: >
      Change the declared return type of a method.
      Parses `newType` and sets it on the matched `MethodDeclaration`.
    parameters:
      - name: newType
        type: String
        description: The new return type.
    appliesTo:
      - MethodDeclaration
    example: |
      Before:
      
      @GET
      public Response getConfigurationById(...) { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "methodName": "getConfigurationById",
          "returnTypePattern": "\\bResponse\\b"
        },
        "actions": [
          { "changeMethodReturnType": { "newType": "ResponseEntity" } }
        ]
      }
      
      After:
      
      public ResponseEntity getConfigurationById(...) { … }
      

  - key: renameMethod
    class: RenameMethodAction
    description: >
      Rename a method declaration.
      Changes the name of the matched `MethodDeclaration` to `newName`.
    parameters:
      - name: newName
        type: String
        description: The new method name.
    appliesTo:
      - MethodDeclaration
    example: |
      Before:
      
      public Response health(String name) { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "methodName": "health"
        },
        "actions": [
          { "renameMethod": { "newName": "isHealthy" } }
        ]
      }
      
      After:
      
      @Override
      public ResponseEntity isHealthy(String name) { … }
      

  - key: removeParameter
    class: RemoveParameterAction
    description: >
      Remove a parameter from a method declaration.
      Finds the parameter named `name` on the matched `MethodDeclaration` and removes it.
    parameters:
      - name: name
        type: String
        description: The name of the method parameter to remove.
    appliesTo:
      - MethodDeclaration
    example: |
      Before:
      
      public ResponseEntity isHealthy(String name) { … }
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodDeclaration",
          "methodName": "isHealthy",
          "paramCount": 1
        },
        "actions": [
          { "removeParameter": { "name": "name" } }
        ]
      }
      
      After:
      
      public ResponseEntity isHealthy() { … }
      

  - key: removeArgument
    class: RemoveArgumentAction
    description: >
      Remove an argument from a method call.
      Removes the argument at the zero‑based index `index` from the matched `MethodCallExpr`.
    parameters:
      - name: index
        type: Integer
        description: Zero‑based position of the argument to remove.
    appliesTo:
      - MethodCallExpr
    example: |
      Before:
      
      JPAStoredProcedureFactory.getInstance(Constants.ams)
        .getStoredProcedure(uri, id);
      
      Recipe:
      
      {
        "match": {
          "nodeType": "MethodCallExpr",
          "methodName": "getStoredProcedure"
        },
        "actions": [
          { "removeArgument": { "index": 0 } }
        ]
      }
      
      After:
      
      JPAStoredProcedureFactory.getInstance(Constants.ams)
        .getStoredProcedure(id);
      
  - key: instanceOfToPattern
    class: InstanceOfToPatternAction
    description: >
      Convert an old‐style `instanceof` check plus a following cast and local
      variable declaration into Java 17’s pattern‐matching form.  
      It transforms:
      ```java
      if (expr instanceof Type) {
          Type var = (Type) expr;
          // …use var…
      }
      ```
      into:
      ```java
      if (expr instanceof Type var) {
          // …use var…
      }
      ```
      and removes the redundant cast and declaration.
    parameters: []
    appliesTo:
      - InstanceOfExpr
    example: |
      Before:

      ```java
      public class PatternTest {
          void test(Object obj) {
              if (obj instanceof Integer) {
                  Integer i = (Integer) obj;
                  System.out.println(i + 1);
              }
          }
      }
      ```

      Recipe:

      ```json
      {
        "match": {
          "nodeType": "InstanceOfExpr"
        },
        "actions": [
          { "instanceOfToPattern": {} }
        ]
      }
      ```

      After:

      ```java
      public class PatternTest {
          void test(Object obj) {
              if (obj instanceof Integer integer) {
                  System.out.println(integer + 1);
              }
          }
      }
      ```  

