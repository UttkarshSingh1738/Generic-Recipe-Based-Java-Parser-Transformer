  - key: instanceOfToPattern
    class: InstanceOfToPatternAction
    description: >
      Convert an old‐style `instanceof` check plus a following cast and local
      variable declaration into Java 17’s pattern‐matching form.  
      It transforms:
      ```java
      if (expr instanceof Type) {
          Type var = (Type) expr;
          // …use var…
      }
      ```
      into:
      ```java
      if (expr instanceof Type var) {
          // …use var…
      }
      ```
      and removes the redundant cast and declaration.
    parameters: []
    appliesTo:
      - InstanceOfExpr
    example: |
      Before:

      public class PatternTest {
          void test(Object obj) {
              if (obj instanceof Integer) {
                  Integer i = (Integer) obj;
                  System.out.println(i + 1);
              }
          }
      }

      Recipe:

      {
        "match": {
          "nodeType": "InstanceOfExpr"
        },
        "actions": [
          { "instanceOfToPattern": {} }
        ]
      }

      After:

      public class PatternTest {
          void test(Object obj) {
              if (obj instanceof Integer integer) {
                  System.out.println(integer + 1);
              }
          }
      }

  - key: replaceStringFormatWithFormatted
    class: ReplaceStringFormatWithFormattedAction
    description: >
      Rewrite calls to `String.format(fmt, args…)` into Java 17’s instance‐method
      form: `fmt.formatted(args…)`.  
      Optionally wrap the format‐string in parentheses when it isn’t a simple literal.
    parameters:
      - name: parenthesizeFirstArg
        type: Boolean
        default: true
        description: >
          If `true`, and the format‐string expression is not a simple literal or name,
          wrap it in parentheses before calling `.formatted(...)`.
    appliesTo:
      - MethodCallExpr
    example: |
      Before:

      this.setId(String.format("user-%s-%s", userId, timestamp + ""));
      log.error(
        String.format("Failed to load %s", resourceName), 
        e
      );

      Recipe:

      {
        "match": {
          "nodeType": "MethodCallExpr",
          "scopePattern": "String",
          "methodName": "format"
        },
        "actions": [
          {
            "replaceStringFormatWithFormatted": {
              "parenthesizeFirstArg": true
            }
          }
        ]
      }

      After:

      this.setId("user-%s-%s".formatted(userId, timestamp + ""));
      log.error(
        "Failed to load %s".formatted(resourceName), 
        e
      );

  - key: changeMethodTargetToStatic
    class: ChangeMethodTargetToStaticAction
    description: >
      Convert instance method calls to static method calls by replacing the scope
      with a class name. Designed for Java modernization where instance methods 
      have been deprecated in favor of static equivalents.
    parameters:
      - name: methodPattern
        type: String
        description: Pattern for matching the original scope (not currently used in matching logic).
      - name: targetType
        type: String
        description: Fully qualified class name to use as the new static scope.
    appliesTo:
      - MethodCallExpr
    example: |
      Before:

      public class MethodTargetToStaticTest {
          void testToolProviderCalls() {
              ToolProvider provider = new ToolProvider();
              JavaCompiler compiler1 = provider.getSystemJavaCompiler();
              DocumentationTool docTool1 = provider.getSystemDocumentationTool();
              
              Modifier mod = new Modifier();
              boolean isPublic = mod.isPublic(123);
              boolean isStatic = mod.isStatic(456);
          }
      }

      Recipe:

      {
        "name": "ChangeToolProviderToStatic",
        "imports": ["javax.tools.ToolProvider"],
        "steps": [
          {
            "match": {
              "nodeType": "MethodCallExpr",
              "methodName": "getSystemJavaCompiler|getSystemDocumentationTool|getSystemToolClassLoader"
            },
            "actions": [
              {
                "changeMethodTargetToStatic": {
                  "methodPattern": "javax.tools.ToolProvider *",
                  "targetType": "javax.tools.ToolProvider"
                }
              }
            ]
          },
          {
            "match": {
              "nodeType": "ExpressionStmt",
              "matchExpr": "ToolProvider\\s+\\w+\\s*=\\s*new\\s+ToolProvider\\(\\)"
            },
            "actions": [
              { "removeNode": {} }
            ]
          }
        ]
      }

      After:

      import javax.tools.ToolProvider;
      public class MethodTargetToStaticTest {
          void testToolProviderCalls() {
              JavaCompiler compiler1 = ToolProvider.getSystemJavaCompiler();
              DocumentationTool docTool1 = ToolProvider.getSystemDocumentationTool();
              
              boolean isPublic = Modifier.isPublic(123);
              boolean isStatic = Modifier.isStatic(456);
          }
      }

  - key: replacePackage
    class: ReplacePackageAction
    description: >
      Replace all occurrences of an old package name with a new package name.
      Handles import declarations, fully qualified type references, field access 
      expressions, method calls on qualified types, object creation with qualified 
      types, and qualified name expressions. Ideal for comprehensive package 
      migrations (e.g., javax.* → java.*, com.sun.net.ssl → javax.net.ssl).
    parameters:
      - name: oldPackage
        type: String
        description: The old package name to replace.
        required: true
      - name: newPackage
        type: String
        description: The new package name to use.
        required: true
    appliesTo:
      - ImportDeclaration
      - ClassOrInterfaceType
      - FieldAccessExpr
      - MethodCallExpr
      - ObjectCreationExpr
      - NameExpr
    example: |
      Before:
      
      import javax.security.cert.X509Certificate;
      import com.sun.net.ssl.SSLContext;
      
      public class CertTest {
          javax.security.cert.X509Certificate cert;
          
          public void set(javax.security.cert.X509Certificate c) {
              this.cert = c;
              // Qualified method call
              com.sun.net.ssl.SSLContext.getInstance("SSL");
              // Object creation with qualified type
              new com.sun.net.ssl.SSLContext();
          }
      }
      
      Recipe:
      
      {
        "steps": [
          {
            "match": {
              "nodeType": "ImportDeclaration",
              "matchExpr": "javax\\.security\\.cert"
            },
            "actions": [
              {
                "replacePackage": {
                  "oldPackage": "javax.security.cert",
                  "newPackage": "java.security.cert"
                }
              }
            ]
          },
          {
            "match": {
              "nodeType": "ClassOrInterfaceType",
              "matchExpr": "javax\\.security\\.cert"
            },
            "actions": [
              {
                "replacePackage": {
                  "oldPackage": "javax.security.cert",
                  "newPackage": "java.security.cert"
                }
              }
            ]
          },
          {
            "match": {
              "nodeType": "FieldAccessExpr",
              "matchExpr": "com\\.sun\\.net\\.ssl"
            },
            "actions": [
              {
                "replacePackage": {
                  "oldPackage": "com.sun.net.ssl",
                  "newPackage": "javax.net.ssl"
                }
              }
            ]
          },
          {
            "match": {
              "nodeType": "ObjectCreationExpr",
              "matchExpr": "com\\.sun\\.net\\.ssl"
            },
            "actions": [
              {
                "replacePackage": {
                  "oldPackage": "com.sun.net.ssl",
                  "newPackage": "javax.net.ssl"
                }
              }
            ]
          }
        ]
      }
      
      After:
      
      import java.security.cert.X509Certificate;
      import javax.net.ssl.SSLContext;
      
      public class CertTest {
          java.security.cert.X509Certificate cert;
          
          public void set(java.security.cert.X509Certificate c) {
              this.cert = c;
              // Qualified method call
              javax.net.ssl.SSLContext.getInstance("SSL");
              // Object creation with qualified type
              new javax.net.ssl.SSLContext();
          }
      }

